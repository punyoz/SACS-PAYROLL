<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNCS Payroll Management System</title>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('bncs-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <script>
    (function() {
      var role = new URLSearchParams(window.location.search).get('role');
      var head = document.getElementsByTagName('head')[0];
      var roleCssMap = { admin: 'css/admin.css', accountant: 'css/accountant.css', employee: 'css/employee.css' };

      function addStylesheet(href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        head.appendChild(link);
      }

      if (role && roleCssMap[role]) {
        addStylesheet(roleCssMap[role]);
      } else {
        // No role yet (login screen) — load all role styles so post-login render is instant.
        Object.keys(roleCssMap).forEach(function(k) { addStylesheet(roleCssMap[k]); });
      }

      // Preload role-specific page + script so the fetch starts before bootstrap runs.
      function addPreload(href, asType) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = asType;
        link.href = href;
        if (asType === 'fetch') link.crossOrigin = 'anonymous';
        head.appendChild(link);
      }

      addPreload('js/app.js', 'script');
      addPreload('pages/login.html', 'fetch');
      if (role === 'admin') {
        addPreload('pages/admin.html', 'fetch');
        addPreload('js/admin.js', 'script');
      } else if (role === 'accountant') {
        addPreload('pages/accountant.html', 'fetch');
        addPreload('js/accountant.js', 'script');
      } else if (role === 'employee') {
        addPreload('pages/employee.html', 'fetch');
        addPreload('js/employee.js', 'script');
      }
    })();
  </script>
</head>
<body>
  <main id="app-root" aria-live="polite"></main>

  <script>
    async function loadFragment(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error('Failed to load ' + path + ' (' + response.status + ')');
      }
      return response.text();
    }

    function loadScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = path;
        script.defer = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load script: ' + path));
        document.body.appendChild(script);
      });
    }

    function safeParseJson(raw) {
      try {
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function inferInitials(name) {
      var text = String(name || '').trim();
      if (!text) return '';
      var parts = text.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function applyBootIdentityFromStorage() {
      var raw = localStorage.getItem('bncs-auth-context');
      var ctx = safeParseJson(raw) || {};

      var fullName = String(ctx.full_name || '').trim();
      var role = String(ctx.role || '').trim().toLowerCase();
      var employeeType = String(ctx.employee_type || '').trim();
      var employeeId = String(ctx.employee_id || '').trim();
      var position = String(ctx.position || '').trim();

      if (!fullName) return;

      // Employee portal placeholders
      var topName = document.getElementById('emp-top-name');
      if (topName) topName.textContent = 'Welcome, ' + fullName;

      var avatar = document.getElementById('emp-avatar');
      if (avatar) avatar.textContent = inferInitials(fullName) || avatar.textContent;

      var helloTitle = document.getElementById('emp-hello-title');
      if (helloTitle) helloTitle.textContent = fullName + ' 👋';

      var helloMeta = document.getElementById('emp-hello-meta');
      if (helloMeta) {
        var pieces = ['Employee'];
        if (employeeType) pieces.push(employeeType + ' Staff');
        else if (position) pieces.push(position);
        pieces.push(employeeId || 'N/A');
        helloMeta.textContent = pieces.join(' · ');
      }

      // Accountant portal placeholders
      var acName = document.getElementById('ac-user-name');
      if (acName && (role === 'accountant' || position.toLowerCase().indexOf('account') >= 0)) {
        acName.textContent = fullName;
      }
      var acAvatar = document.querySelector('#s-accountant .sb-foot .av');
      if (acAvatar && (role === 'accountant' || position.toLowerCase().indexOf('account') >= 0)) {
        acAvatar.textContent = inferInitials(fullName) || acAvatar.textContent;
      }

      // Admin portal placeholders
      var admName = document.getElementById('adm-user-name');
      if (admName && role === 'admin') {
        admName.textContent = fullName;
      }
    }

    async function bootstrapApp() {
      const appRoot = document.getElementById('app-root');
      const role = new URLSearchParams(window.location.search).get('role');

      // Always include login.html as fallback for logout/unauthenticated state.
      // Otherwise only load the active role's portal HTML + script — saves ~70% of payload.
      const pageFiles = ['pages/login.html'];
      const scriptFiles = ['js/app.js'];

      if (role === 'admin') {
        pageFiles.push('pages/admin.html');
        scriptFiles.push('js/admin.js');
      } else if (role === 'accountant') {
        pageFiles.push('pages/accountant.html');
        scriptFiles.push('js/accountant.js');
      } else if (role === 'employee') {
        pageFiles.push('pages/employee.html');
        scriptFiles.push('js/employee.js');
      } else {
        // No role param — login screen only; load role bundles lazily on success.
      }

      try {
        // Kick off HTML fragments AND script fetches in parallel.
        // Scripts use defer so they execute in order regardless of load order.
        const htmlPromise = Promise.all(pageFiles.map(loadFragment));
        const scriptsPromise = Promise.all(scriptFiles.map(loadScript));

        const htmlChunks = await htmlPromise;
        appRoot.innerHTML = htmlChunks.join('\n');

        // Apply identity immediately so the UI doesn't flash placeholders.
        applyBootIdentityFromStorage();

        await scriptsPromise;
      } catch (error) {
        appRoot.innerHTML = '<div style="padding:24px;font-family:DM Sans, sans-serif;color:#E85555;">Unable to load app resources. Please check file paths and run from a local server.<br><small>' + String(error.message || error) + '</small></div>';
      }
    }

    bootstrapApp();
  </script>
</body>
</html>

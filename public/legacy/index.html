<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SACS Payroll Management System</title>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('sacs-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // Cache-bust version. This used to be Math.floor(Date.now() / 300000),
      // which minted a brand-new URL for every asset every 5 minutes — so the
      // browser re-downloaded the entire portal several times an hour and the
      // HTTP cache never got to do its job. It is now a fixed build stamp:
      // bump ?v= here when shipping legacy asset changes.
      window._bv = '20260917h';

      // Which portal this is. LegacyRoleFrame renders the iframe as
      // /legacy/index.html?role=<role>, so the role is known before a single
      // asset is requested — no need to load all five portals' assets and let
      // the right one win.
      var role = (new URLSearchParams(window.location.search).get('role') || '')
        .trim().toLowerCase();
      var KNOWN = { admin: 1, accountant: 1, employee: 1, hr: 1, 'super_admin': 1 };
      if (!KNOWN[role]) role = '';
      window._role = role;

      // An account still on the password it was issued sees the mandatory
      // change-password screen and nothing of its portal. The flag comes from
      // the sign-in response; rbac.js re-checks it against the signed session
      // and reloads if the two disagree, and the API refuses everything else
      // until the password is changed regardless of what the browser shows.
      var gate = false;
      try {
        var storedCtx = JSON.parse(localStorage.getItem('sacs-auth-context') || 'null');
        gate = Boolean(role && storedCtx && storedCtx.must_change_password === true);
      } catch (e) { gate = false; }
      window._passwordGate = gate;

      // CSS is deliberately NOT split per role. All seven sheets together are
      // ~75 KB, and the role sheets are not actually role-exclusive: every
      // portal uses admin.css's .adm-modal-*/.adm-feedback and employee.css's
      // .ep-* profile cards. Splitting would save a few KB and risk unstyled
      // panels. With a stable ?v= these are cached after the first visit.
      var sheets = ['css/theme.css','css/base.css','css/layout.css','css/admin.css','css/accountant.css','css/employee.css','css/super-admin.css','css/print.css'];

      sheets.forEach(function(href) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href + '?v=' + window._bv;
        document.head.appendChild(l);
      });

      // The scripts must still EXECUTE in order (app.js -> portal -> rbac.js),
      // but they can DOWNLOAD in parallel, starting now rather than after the
      // page fragments land. By the time bootstrapApp() appends them they are
      // already in the cache.
      var ROLE_SCRIPT = {
        admin: 'js/admin.js',
        accountant: 'js/accountant.js',
        employee: 'js/employee.js',
        hr: 'js/hr.js',
        'super_admin': 'js/super-admin.js'
      };
      var preload = ['js/app.js', 'js/rbac.js'];
      if (role && ROLE_SCRIPT[role] && !gate) preload.push(ROLE_SCRIPT[role]);
      preload.forEach(function(href) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'script';
        l.href = href + '?v=' + window._bv;
        document.head.appendChild(l);
      });
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <main id="app-root" aria-live="polite"></main>

  <script>
    async function loadFragment(path) {
      const response = await fetch(path + '?v=' + (window._bv || 0));
      if (!response.ok) {
        throw new Error('Failed to load ' + path + ' (' + response.status + ')');
      }
      return response.text();
    }

    function loadScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = path + '?v=' + (window._bv || 0);
        script.defer = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load script: ' + path));
        document.body.appendChild(script);
      });
    }

    function safeParseJson(raw) {
      try {
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function inferInitials(name) {
      var text = String(name || '').trim();
      if (!text) return '';
      var parts = text.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function applyBootIdentityFromStorage() {
      var raw = localStorage.getItem('sacs-auth-context');
      var ctx = safeParseJson(raw) || {};

      var fullName = String(ctx.full_name || '').trim();
      var role = String(ctx.role || '').trim().toLowerCase();
      var employeeType = String(ctx.employee_type || '').trim();
      var employeeId = String(ctx.employee_id || '').trim();
      var position = String(ctx.position || '').trim();

      if (!fullName) return;

      // Employee portal placeholders
      var topName = document.getElementById('emp-top-name');
      if (topName) topName.textContent = 'Welcome, ' + fullName;

      var avatar = document.getElementById('emp-avatar');
      if (avatar) avatar.textContent = inferInitials(fullName) || avatar.textContent;

      var helloTitle = document.getElementById('emp-hello-title');
      if (helloTitle) helloTitle.textContent = fullName + ' 👋';

      var helloMeta = document.getElementById('emp-hello-meta');
      if (helloMeta) {
        var pieces = ['Employee'];
        if (employeeType) pieces.push(employeeType + ' Staff');
        else if (position) pieces.push(position);
        pieces.push(employeeId || 'N/A');
        helloMeta.textContent = pieces.join(' · ');
      }

      // Accountant portal placeholders
      var acName = document.getElementById('ac-user-name');
      if (acName && (role === 'accountant' || position.toLowerCase().indexOf('account') >= 0)) {
        acName.textContent = fullName;
      }
      var acAvatar = document.querySelector('#s-accountant .sb-foot .av');
      if (acAvatar && (role === 'accountant' || position.toLowerCase().indexOf('account') >= 0)) {
        acAvatar.textContent = inferInitials(fullName) || acAvatar.textContent;
      }

      // Admin portal placeholders
      var admName = document.getElementById('adm-user-name');
      if (admName && role === 'admin') {
        admName.textContent = fullName;
      }

      // Super Admin portal placeholders
      var saName = document.getElementById('sa-user-name');
      if (saName && role === 'super_admin') {
        saName.textContent = fullName;
      }
      var saAvatar = document.getElementById('sa-avatar');
      if (saAvatar && role === 'super_admin' && fullName) {
        var saParts = fullName.trim().split(/\s+/);
        saAvatar.textContent = saParts.length >= 2
          ? (saParts[0][0] + saParts[saParts.length - 1][0]).toUpperCase()
          : fullName.slice(0, 2).toUpperCase();
      }
    }

    // Only the signed-in role's portal is loaded. Previously all six page
    // fragments and all six portal scripts were loaded for everyone — ~700 KB
    // of HTML+JS to render one portal, five-sixths of it dead weight.
    //
    // It also fixed a real bug. Every portal script shared one global scope,
    // so same-named functions silently overwrote each other in load order:
    // accountant.js's renderDashboard()/renderAttendanceTable() replaced
    // admin.js's, and admin.js's loadDashboard() then called the accountant
    // version, which ignores its argument and writes to accountant DOM ids.
    // That is why Admin's dashboard panels and Recent Payroll Activity never
    // populated. Loading one portal at a time makes the collision impossible.
    const ROLE_ASSETS = {
      admin:         { page: 'pages/admin.html',       script: 'js/admin.js' },
      accountant:    { page: 'pages/accountant.html',  script: 'js/accountant.js' },
      employee:      { page: 'pages/employee.html',    script: 'js/employee.js' },
      hr:            { page: 'pages/hr.html',          script: 'js/hr.js' },
      'super_admin': { page: 'pages/super-admin.html', script: 'js/super-admin.js' }
    };

    async function bootstrapApp() {
      const appRoot = document.getElementById('app-root');
      const assets = ROLE_ASSETS[window._role];
      const gate = Boolean(assets && window._passwordGate);

      // Login always ships: it is the fallback when no role is on the URL, and
      // app.js's login() drives it.
      const pageFiles = ['pages/login.html'];
      if (gate) pageFiles.push('pages/change-password.html');
      else if (assets) pageFiles.push(assets.page);

      try {
        const htmlChunks = await Promise.all(pageFiles.map(loadFragment));
        appRoot.innerHTML = htmlChunks.join('\n');

        // Apply identity immediately so the UI doesn't flash placeholders.
        applyBootIdentityFromStorage();

        // app.js first (every portal builds on its helpers), then this role's
        // portal script, then rbac.js last — it rewrites the sidebar from
        // /api/rbac/me and needs the portal's nav handlers already defined.
        await loadScript('js/app.js');
        if (assets && !gate) await loadScript(assets.script);
        await loadScript('js/rbac.js');
      } catch (error) {
        appRoot.innerHTML = '<div style="padding:24px;font-family:DM Sans, sans-serif;color:#E85555;">Unable to load app resources. Please check file paths and run from a local server.<br><small>' + String(error.message || error) + '</small></div>';
      }
    }

    bootstrapApp();
  </script>
</body>
</html>
